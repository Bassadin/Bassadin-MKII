name: Build, Test and Deploy with FTP

on:
  push:
  pull_request:
  merge_group:

jobs:
    eslint:
        name: ESLint Check
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
            - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
            - uses: actions/setup-node@60c11408891ef62846c29c28c2374afe5c91fad5 # master
              with:
                  node-version: 24.x
            - name: pnpm module install
              run: pnpm install --frozen-lockfile
            - name: Run ESLint
              run: pnpm run eslint:scan

    build:
        name: Build
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
            - uses: actions/setup-node@60c11408891ef62846c29c28c2374afe5c91fad5 # master
              with:
                  node-version: 24.x
            - name: pnpm module install
              run: pnpm install --frozen-lockfile
            - name: astro build
              run: pnpm run build
            - uses: actions/upload-artifact@0c366cb4fc8897159c94880f94b55bc716ad6a66 # master
              with:
                  name: build-artifact
                  path: dist/

    test-cypress:
        name: Cypress Tests
        runs-on: ubuntu-24.04
        needs:
            - build
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
            - uses: actions/setup-node@60c11408891ef62846c29c28c2374afe5c91fad5 # master
              with:
                  node-version: 24.x
            - uses: actions/download-artifact@2a5974104b6d5dbdb2f9468a3e54da3bdd241578 # master
              with:
                  name: build-artifact
                  path: dist/
            - name: Cypress run
              uses: cypress-io/github-action@01e3b659a495b41649cdd0aa82e1d1624e26520b # v7.4.4
              with:
                  start: npx serve dist
                  browser: chrome

    deploy:
        needs:
            - eslint
            - build
            - test-cypress
        runs-on: ubuntu-24.04
        environment:
            name: production
            url: https://bassadin.de/
        # Deploy only on a tag
        if: startsWith(github.ref, 'refs/tags/v')
        name: Deploy to FTP Server
        steps:
            - uses: actions/download-artifact@2a5974104b6d5dbdb2f9468a3e54da3bdd241578 # master
              with:
                  name: build-artifact
                  path: dist/
            - name: Deploy to FTP Server
              uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
              with:
                  server: ha01s018.org-dns.com
                  username: bassadin_root_website
                  password: ${{ secrets.FTP_Password }}
                  protocol: ftps
                  local-dir: dist/
                  security: strict
