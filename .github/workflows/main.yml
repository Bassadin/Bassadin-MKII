name: Build, Test and Deploy with FTP

on:
  push:
  pull_request:
  merge_group:

jobs:
    build:
        name: Build
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
            - uses: actions/setup-node@master
              with:
                  node-version: 24.x
            - name: pnpm module install
              run: pnpm install --frozen-lockfile
            - name: astro build
              run: pnpm run build
            - uses: actions/upload-artifact@master
              with:
                  name: build-artifact
                  path: dist/

    test-cypress:
        name: Cypress Tests
        runs-on: ubuntu-24.04
        needs:
            - build
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
            - uses: actions/setup-node@master
              with:
                  node-version: 24.x
            - uses: actions/download-artifact@master
              with:
                  name: build-artifact
                  path: dist/
            - name: Cypress run
              uses: cypress-io/github-action@09090944bd8aaa2a517cefb6e38bf1aae336b42b # v7.4.3
              with:
                  start: npx serve dist
                  browser: chrome

    deploy:
        needs:
            - build
            - test-cypress
        runs-on: ubuntu-24.04
        environment:
            name: production
            url: https://bassadin.de/
        # Deploy only on a tag
        if: startsWith(github.ref, 'refs/tags/v')
        name: Deploy to FTP Server
        steps:
            - uses: actions/download-artifact@master
              with:
                  name: build-artifact
                  path: dist/
            - name: Deploy to FTP Server
              uses: SamKirkland/FTP-Deploy-Action@a51268f67f6605236975928ae28b0f7e9971d50a # v4.3.6
              with:
                  server: ha01s018.org-dns.com
                  username: bassadin_root_website
                  password: ${{ secrets.FTP_Password }}
                  protocol: ftps
                  local-dir: dist/
                  security: strict
